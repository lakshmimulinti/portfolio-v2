<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0f17" stroke="url(#brandGrad)" stroke-width="2.5" />

  <!-- Code brackets </> representing Full Stack Developer -->
  <path d="M18 24 L10 32 L18 40" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M46 24 L54 32 L46 40" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M36 20 L28 44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Monogram Letter L for Lakshmi -->
  <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="url(#brandGrad)" text-anchor="middle" filter="url(#glow)">L</text>

  <!-- Status Glowing Dot -->
  <circle cx="49" cy="15" r="3" fill="#22c55e" />
</svg>
